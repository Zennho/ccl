[package]
name = "ccl-launcher"
version = "0.1.17"
edition = "2021"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots", "system-proxy", "socks", "multipart"] }
tokio = { version = "1", features = ["fs", "process", "io-util", "time", "sync", "net", "macros"] }
futures-util = "0.3"
sha1 = "0.10"
sha2 = "0.10"
tar = "0.4"
flate2 = "1"
md5 = "0.7"
dirs = "6"
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri-plugin-dialog = "2.8.3"
base64 = "0.22"
png = "0.18"
getrandom = "0.3"
if-addrs = "0.15.0"
socket2 = "0.6"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
semver = "1"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
