<body>
<div class="guide">
<div class="guide-top"><div><div class="guide-kicker">CCL / DESIGN EXPLORATION</div><h1>选择你喜欢的启动器风格</h1><p>下面是同一款启动器的三种视觉方向。切换模板和页面，看看实际使用时的样子。</p></div><div class="guide-note">独立预览 · 不会修改游戏和启动器设置</div></div>

<script>
